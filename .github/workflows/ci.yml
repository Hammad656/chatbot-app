name: ResolveAI checks
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-ci-password
          POSTGRES_DB: resolveai_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d resolveai_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: temporary-ci-password
      POSTGRES_DB: resolveai_ci
      JWT_SECRET_KEY: temporary-ci-only-signing-key-at-least-32-characters
      RESOLVEAI_INLINE_WORKER: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated test stack
        run: |
          cat > backend/.env <<'ENV'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=temporary-browser-test-password
          POSTGRES_DB=resolveai_browser_tests
          JWT_SECRET_KEY=temporary-browser-test-signing-key-at-least-32-characters
          GEMINI_API_KEY=
          COOKIE_SECURE=false
          ENV
          docker compose --env-file backend/.env up --build --wait --wait-timeout 180
          curl --silent --show-error --fail --retry-connrefused --retry 30 --retry-delay 2 --retry-max-time 120 http://127.0.0.1:3000/login -o /dev/null
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file backend/.env logs --tail 150 api worker web
      - name: Remove isolated CI containers and data
        if: always()
        run: docker compose --env-file backend/.env down --volumes --remove-orphans
