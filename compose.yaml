services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot-db}
    volumes:
      - resolveai_database:/var/lib/postgresql/data
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: resolveai_app
      POSTGRES_PASSWORD: ${RESOLVEAI_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      MIGRATION_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      MIGRATION_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESOLVEAI_WORKER_PASSWORD: ${RESOLVEAI_WORKER_PASSWORD:-${POSTGRES_PASSWORD}}
      RESOLVEAI_REQUIRE_RLS: "true"
      RESOLVEAI_INLINE_WORKER: "false"
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /var/lib/resolveai/uploads
    volumes:
      - resolveai_uploads:/var/lib/resolveai/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - resolveai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: resolveai_worker
      POSTGRES_PASSWORD: ${RESOLVEAI_WORKER_PASSWORD:-${POSTGRES_PASSWORD}}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /var/lib/resolveai/uploads
      RESOLVEAI_INLINE_WORKER: "false"
    command: ["arq", "resolveai.jobs.WorkerSettings"]
    volumes:
      - resolveai_uploads:/var/lib/resolveai/uploads
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  resolveai_database:
  resolveai_uploads:
  resolveai_redis:
